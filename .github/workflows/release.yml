# Publie une version quand on pousse un tag vX.Y (voir publier.ps1)
name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que le numéro de version du code correspond au tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+$') { throw "Tag de version invalide" }
          $tag = $env:RELEASE_TAG.Substring(1)
          $code = (Select-String -Path src/Properties/AssemblyInfo.cs -Pattern 'public const string Version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($code -ne $tag) { throw "Le tag v$tag ne correspond pas à AppInfo.Version ($code) dans src/Properties/AssemblyInfo.cs" }

      - name: Compiler
        shell: cmd
        run: build.cmd

      - name: Vérifier la version de l'exe produit
        shell: pwsh
        run: |
          $v = (Get-Item BureauCache.exe).VersionInfo.ProductVersion
          if ($v -ne $env:RELEASE_TAG.Substring(1)) { throw "Version de l'exe inattendue : $v" }

      - name: Calculer l'empreinte SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash BureauCache.exe -Algorithm SHA256).Hash.ToLower()
          "$h  BureauCache.exe" | Out-File -Encoding ascii -NoNewline BureauCache.exe.sha256
          "SHA-256 : $h"

      - name: Créer la version GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $ver = $tag.Substring(1)
          $title = "BureauCache $ver"
          $section = ""
          if (Test-Path CHANGELOG.md) {
            [string[]]$lines = @(Get-Content CHANGELOG.md -Encoding utf8)
            $heading = "^## $([regex]::Escape($ver))(?=\s|$)"
            $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match $heading })
            if ($start -ge 0) {
              # « ## 3.2 — Optimisation, sécurité et code » donne le titre « BureauCache 3.2 — Optimisation, sécurité et code »
              $suffix = ($lines[$start] -replace $heading, '').Trim()
              if ($suffix) { $title = "$title $suffix" }
              $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
              if ($end -lt 0) { $end = $lines.Length }
              if ($end -gt $start + 1) {
                $section = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
              }
            }
          }
          if (-not $section) { $section = "Version $ver" }
          $section | Out-File -Encoding utf8 release-notes.md
          # Brouillon : invisible des installations tant qu'il n'est pas signé et publié par outils/signer-version.ps1
          # (la clé de signature ne passe jamais par GitHub, voir DECISIONS.md D-004)
          gh release create $tag BureauCache.exe BureauCache.exe.sha256 --draft --title $title --notes-file release-notes.md
