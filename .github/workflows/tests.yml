# Compile l'application (build.cmd) puis lance les tests à chaque push sur main et chaque pull request
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compiler et tester
        shell: pwsh
        # Un test WinForms figé produit un rapport de blocage au lieu de faire attendre la CI jusqu'au délai global
        run: dotnet test tests/BureauCache.Tests --configuration Release --logger "console;verbosity=normal" --logger "trx;LogFileName=resultats.trx" --blame-hang-timeout 60s

      # En cas d'échec ou de blocage, les résultats et les rapports de blocage restent consultables (QA34-11)
      - name: Publier les résultats des tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: tests/BureauCache.Tests/TestResults/
          if-no-files-found: ignore
